[package]
title = "Ergo Scan"
version = "0.1.0"
description = "Window > Ergo Scan: ergonomic scan (RULA) of every animated operator in the open stage - ranking, worst moments (jump to them), viewport risk markers, HTML dashboard, score panels, floor map. Same scan from scripts: from ergo_scan import scan."
category = "Simulation"
keywords = ["ergonomics", "rula", "people", "operators", "manufacturing"]
authors = ["Alaa Eldakrory"]
readme = "../../README.md"

[dependencies]
"omni.usd" = {}
"omni.ui" = {}
"omni.timeline" = {}

[[python.module]]
name = "ergo_scan"

# Pillow is only needed for the PNG dashboards (the HTML dashboard, report and markers work without it). Kit usually
# ships it; otherwise it installs from the repository's wheels folder (no internet needed).
[python.pipapi]
requirements = ["pillow"]
modules = ["PIL"]
archiveDirs = ["../../wheels"]
use_online_index = true
